<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 160" role="img" aria-label="SPACESTATION">
<title>SPACESTATION</title>
<!-- SpaceStation wordmark — vector, drawn for this product (not traced from any raster).
     Sits as the native counterpart to the legacy wordmark so the splash and titlebar can render
     SpaceStation identity. Palette follows the station console: phosphor green on transparent. -->
<defs>
  <linearGradient id="ssWordGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8dffb0"/>
    <stop offset="0.55" stop-color="#4ee88a"/>
    <stop offset="1" stop-color="#27c96a"/>
  </linearGradient>
  <filter id="ssWordGlow" x="-8%" y="-30%" width="116%" height="160%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- orbit ring: the "station" motif, a shallow ellipse threading the wordmark -->
<g fill="none" stroke="#27c96a" stroke-opacity="0.55" stroke-width="2.5">
  <ellipse cx="490" cy="80" rx="452" ry="46"/>
</g>
<g fill="#4ee88a" fill-opacity="0.9">
  <circle cx="64" cy="63" r="5.5"/>
  <circle cx="916" cy="97" r="5.5"/>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace"
   font-weight="700" font-size="68" letter-spacing="5.2"
   fill="url(#ssWordGrad)" filter="url(#ssWordGlow)">
  <text x="120" y="103">SPACESTATION</text>
</g>
</svg>
